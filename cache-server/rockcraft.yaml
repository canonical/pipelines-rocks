# Based on: https://github.com/kubeflow/pipelines/blob/2.16.0/backend/Dockerfile.cacheserver
#
# Chisel-based variant: bare base + minimal sliced Ubuntu rootfs.
#
# The cache_server binary is built with CGO_ENABLED=0 (statically linked, no
# libc / libssl / libstdc++ at runtime), so the ONLY runtime dependencies are
# a minimal /etc skeleton and the TLS CA certificate bundle for Go's
# crypto/x509.SystemCertPool() to connect to the Kubernetes API and any
# external object stores.
name: cache-server
summary: Kubeflow Pipelines Cache Server
description: This image is used as part of the Charmed Kubeflow product
version: 2.16.0
license: Apache-2.0
base: bare
build-base: ubuntu@24.04
run-user: _daemon_
platforms:
  amd64:

services:
  cache-server:
    override: replace
    summary: "kfp cache server service"
    startup: enabled
    command: "/bin/cache_server"

parts:
  # ── Stage 1: build a minimal Ubuntu rootfs with Chisel ─────────────────
  chisel-rootfs:
    plugin: nil
    build-packages:
      - ca-certificates
    override-build: |
      CHISEL_VER="v1.5.1"
      curl -sL "https://github.com/canonical/chisel/releases/download/${CHISEL_VER}/chisel_${CHISEL_VER}_linux_amd64.tar.gz" \
        | tar xzf - -C /usr/local/bin chisel
      chmod +x /usr/local/bin/chisel

      # Static Go binary: base filesystem + CA certs only. No shared libs
      # (libc6, libssl3t64, libstdc++6, etc.) — CGO_ENABLED=0 links them in.
      chisel cut \
        --release ubuntu-24.04 \
        --root ${CRAFT_PART_INSTALL} \
        base-files_bin \
        base-files_base \
        ca-certificates_data

      # base-files_bin creates /bin as a symlink to /usr/bin. The Go binary
      # lands at /bin/cache_server via the builder part's organize — remove
      # the symlink so the Go plugin's bin/ directory merges cleanly.
      rm -rf "${CRAFT_PART_INSTALL}/bin"

  cache-server:
    plugin: go
    after:
      - chisel-rootfs
    source-type: git
    source: https://github.com/kubeflow/pipelines.git
    source-depth: 1
    source-tag: 2.16.0
    build-snaps:
      - go/1.26/stable
    build-packages:
      - git
    build-environment:
      - GO111MODULE: "on"
      - CGO_ENABLED: "0"
      - GOOS: linux
      - GOARCH: amd64
    override-build: |
      set -xe

      mkdir -p $CRAFT_PART_INSTALL/bin

      go build -o $CRAFT_PART_INSTALL/bin/cache_server $CRAFT_PART_BUILD/backend/src/cache/*.go

  non-root-user:
    after:
      - cache-server
    plugin: nil
    override-prime: |
      craftctl default
      install -d -o 584792 -g 584792 -m 770 \
        etc/webhook/certs

  # ── security-team artifact (dpkg-query-compatible CSV inventory) ───────
  # On a bare base there is no var/lib/dpkg database to query — reconstruct
  # the inventory from the Chisel slices the rootfs actually contains, same
  # column layout as the upstream ubuntu-base build:
  #   ${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}
  security-team-requirement:
    after:
      - non-root-user
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      {
        echo "# os-release: $(. /etc/os-release && echo ${NAME} ${VERSION})"
        for pkg in base-files ca-certificates; do
          ver=$(apt-cache show "$pkg" 2>/dev/null | awk '/^Version:/ {print $2; exit}')
          src=$(apt-cache show "$pkg" 2>/dev/null | awk '/^Source:/ {print $2; exit}')
          echo "ii,${pkg},${ver},${src:-$pkg},${ver}"
        done
      } > ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query
