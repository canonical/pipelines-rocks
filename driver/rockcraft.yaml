# Based on: https://github.com/kubeflow/pipelines/blob/2.16.0/backend/Dockerfile.driver
#
# Chisel-based variant: bare base + minimal sliced Ubuntu rootfs.
#
# The driver binary is built with CGO_ENABLED=0 + -tags netgo +
# -extldflags "-static" (fully statically linked), so the ONLY runtime
# dependencies are a /etc skeleton and the TLS CA certificate bundle
# (Go's crypto/x509 reads /etc/ssl/certs for K8s API, object stores, and
# gRPC connections).
name: kfp-driver
summary: Kubeflow Pipelines Driver
description: This image is used as part of the Charmed Kubeflow product
version: 2.16.0
license: Apache-2.0
base: bare
build-base: ubuntu@24.04
run-user: _daemon_
platforms:
  amd64:

services:
  launcher:
    override: merge
    summary: "kfp driver service"
    startup: enabled
    command: "/bin/driver"

parts:
  # ── Stage 1: build a minimal Ubuntu rootfs with Chisel ─────────────────
  chisel-rootfs:
    plugin: nil
    build-packages:
      - ca-certificates
    override-build: |
      CHISEL_VER="v1.5.1"
      curl -sL "https://github.com/canonical/chisel/releases/download/${CHISEL_VER}/chisel_${CHISEL_VER}_linux_amd64.tar.gz" \
        | tar xzf - -C /usr/local/bin chisel
      chmod +x /usr/local/bin/chisel

      # Static Go binary: base filesystem + CA certs only. No shared libs
      # (libc6, libssl3t64, libstdc++6, etc.) — CGO_ENABLED=0 links them in.
      chisel cut \
        --release ubuntu-24.04 \
        --root ${CRAFT_PART_INSTALL} \
        base-files_bin \
        base-files_base \
        ca-certificates_data

      # /bin symlink created by base-files_bin conflicts with the Go
      # plugin's bin/ directory — remove it so staging merges cleanly.
      rm -rf "${CRAFT_PART_INSTALL}/bin"

  # ── Stage 2: build the statically-linked driver binary ─────────────────
  driver:
    plugin: go
    after:
      - chisel-rootfs
    source-type: git
    source: https://github.com/kubeflow/pipelines.git
    source-depth: 1
    source-tag: 2.16.0
    build-snaps:
      - go/1.26/stable
    build-packages:
      - git
    build-environment:
      - GCFLAGS: ""
      - CGO_ENABLED: "0"
      - GOOS: linux
      - GOARCH: amd64
    override-build: |
      set -xe

      mkdir -p $CRAFT_PART_INSTALL/bin

      go build -tags netgo -gcflags="${GCFLAGS}" \
        -ldflags '-extldflags "-static"' \
        -o $CRAFT_PART_INSTALL/bin/driver \
        $CRAFT_PART_BUILD/backend/src/v2/cmd/driver/*.go

  # ── Stage 3: security-team artifact (dpkg-query-compatible CSV) ───────
  # On a bare base there is no var/lib/dpkg database to query. Reconstruct
  # the inventory from the Chisel slices the rootfs actually contains, same
  # column layout as the upstream ubuntu-base build:
  #   ${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}
  security-team-requirement:
    after:
      - driver
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      {
        echo "# os-release: $(. /etc/os-release && echo ${NAME} ${VERSION})"
        for pkg in base-files ca-certificates; do
          ver=$(apt-cache show "$pkg" 2>/dev/null | awk '/^Version:/ {print $2; exit}')
          src=$(apt-cache show "$pkg" 2>/dev/null | awk '/^Source:/ {print $2; exit}')
          echo "ii,${pkg},${ver},${src:-$pkg},${ver}"
        done
      } > ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query
