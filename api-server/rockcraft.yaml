# Dockerfile: https://github.com/kubeflow/pipelines/blob/2.16.0/backend/Dockerfile
#
# Chisel-based variant: bare base + minimal sliced Ubuntu rootfs.
#
# The Go binary uses CGO (go-sqlite3), so it is dynamically linked
# against glibc, OpenSSL, libstdc++, and zlib — all provided as Chisel
# slices rather than full DEB packages.
name: api-server
summary: An image for using Kubeflow pipelines API
description: An image for using Kubeflow pipelines API
version: "2.16.0"
base: bare
build-base: ubuntu@24.04
license: Apache-2.0
platforms:
  amd64:
run-user: _daemon_
services:
  apiserver:
    override: merge
    summary: "pipelines api-server service"
    startup: enabled
    environment:
      LOG_LEVEL: "info"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    command: /bin/apiserver --config=/config --sampleconfig=/config/sample_config.json -logtostderr=true --logLevel=$LOG_LEVEL

parts:
  # ── Stage 1: build a minimal Ubuntu rootfs with Chisel ─────────────────
  chisel-rootfs:
    plugin: nil
    build-packages:
      - ca-certificates
    override-build: |
      CHISEL_VER="v1.5.1"
      curl -sL "https://github.com/canonical/chisel/releases/download/${CHISEL_VER}/chisel_${CHISEL_VER}_linux_amd64.tar.gz" \
        | tar xzf - -C /usr/local/bin chisel
      chmod +x /usr/local/bin/chisel

      # Dynamically-linked Go binary (uses CGO for SQLite). Need base
      # filesystem, CA certs, and shared libraries at runtime.
      chisel cut \
        --release ubuntu-24.04 \
        --root ${CRAFT_PART_INSTALL} \
        base-files_bin \
        base-files_base \
        ca-certificates_data \
        libc6_libs \
        libssl3t64_libs \
        libstdc++6_libs \
        openssl_config \
        zlib1g_libs

      # /bin symlink conflicts with Go plugin's bin/ directory.
      rm -rf "${CRAFT_PART_INSTALL}/bin"

  # ── Stage 2: build the Go API server binary ────────────────────────────
  builder:
    after: [chisel-rootfs]
    plugin: go
    source: https://github.com/kubeflow/pipelines.git
    source-tag: 2.16.0
    build-snaps:
      - go/1.26/stable
    build-packages:
      - git
      - cmake
      - clang
      - musl-dev
      - openssl
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/bin
      go build -o ${CRAFT_PART_INSTALL}/bin/apiserver backend/src/apiserver/*.go

  # ── Stage 3: compile and stage the sample pipelines ────────────────────
  # Preserved from the original rockcraft.yaml. Uses the system Python 3.12
  # (default on ubuntu@24.04) instead of deadsnakes Python 3.11.
  compiler:
    after: [chisel-rootfs]
    plugin: nil
    source: https://github.com/kubeflow/pipelines.git
    source-tag: 2.16.0
    build-environment:
      - ARGO_VERSION: v3.7.3
    build-packages:
      - default-jdk
      - python3
      # required to build google-cloud-profiler wheel for pyproject.toml-based projects
      - python3-dev
      - jq
      - wget

    override-build: |
      # Remove the source from the build directory so we don't
      # accidentally use the wrong requirements.txt or inputs
      # The build steps below copy everything that is needed to the working directory
      rm -rf ./*

      # Install setuptools and pip for the system Python 3
      apt-get update && apt-get install -y python3-setuptools python3-pip

      cp $CRAFT_PART_SRC/backend/requirements.txt .
      python3 -m pip install --break-system-packages -r requirements.txt --no-cache-dir

      # Fetch argo CLI
      curl -sL -H "Accept: application/octet-stream" \
      https://github.com/argoproj/argo-workflows/releases/download/${ARGO_VERSION}/argo-linux-amd64.gz \
      -o argo-linux-amd64.gz && \
      gunzip argo-linux-amd64.gz && \
      chmod +x argo-linux-amd64 && \
      mv ./argo-linux-amd64 $CRAFT_PART_INSTALL/argo

      # Compile the sample pipelines
      cp -r $CRAFT_PART_SRC/samples ./samples
      cp $CRAFT_PART_SRC/backend/src/apiserver/config/sample_config.json ./samples/

      set -e; \
      < ./samples/sample_config.json jq ".pipelines[].file" --raw-output | while read pipeline_yaml; do \
      pipeline_py=".${pipeline_yaml%.yaml}"; \
      which python3; \
      echo "Compiling: \"$pipeline_py\"" && python3 "$pipeline_py" && echo -n "Output: " && ls "$pipeline_py.yaml"; \
      done

      cp -r ./samples ${CRAFT_PART_INSTALL}/samples

  # ── Stage 4: assemble the final image ──────────────────────────────────
  server:
    after: [builder, compiler]
    plugin: nil
    source: https://github.com/kubeflow/pipelines.git
    source-tag: 2.16.0
    build-environment:
      # These are set at build in dockerfile (those are just links to examples)
      - COMMIT_SHA: unknown
      - TAG_NAME: unknown
    override-build: |
      cp -r $CRAFT_PART_SRC/backend/src/apiserver/config/ $CRAFT_PART_INSTALL/config
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp $CRAFT_STAGE/bin/apiserver $CRAFT_PART_INSTALL/bin/apiserver
      cp -r $CRAFT_STAGE/samples/ $CRAFT_PART_INSTALL/samples

      sed -E "s#/(blob|tree)/master/#/\1/${COMMIT_SHA}/#g" -i $CRAFT_PART_INSTALL/config/sample_config.json
      sed -E "s/%252Fmaster/%252F${COMMIT_SHA}/#g" -i $CRAFT_PART_INSTALL/config/sample_config.json

  # ── Stage 5: security-team artifact (dpkg-query-compatible inventory) ──
  security-team-requirement:
    after: [server]
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      {
        echo "# os-release: $(. /etc/os-release && echo ${NAME} ${VERSION})"
        for pkg in base-files ca-certificates libc6 libssl3t64 libstdc++6 openssl zlib1g; do
          ver=$(apt-cache show "$pkg" 2>/dev/null | awk '/^Version:/ {print $2; exit}')
          src=$(apt-cache show "$pkg" 2>/dev/null | awk '/^Source:/ {print $2; exit}')
          echo "ii,${pkg},${ver},${src:-$pkg},${ver}"
        done
      } > ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query
